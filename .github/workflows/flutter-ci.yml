name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter-ci:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: |
          dart format lib test
          git diff --exit-code lib test || (echo "Run 'dart format lib test' locally in packages/flutter before pushing" && exit 1)

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          if [ -f coverage/lcov.info ]; then
            # Sum every source-file record; taking only the first LH/LF pair
            # can report a passing percentage while most of the package is
            # uncovered.
            LINES=$(awk -F: '$1 == "LH" { sum += $2 } END { print sum + 0 }' coverage/lcov.info)
            TOTAL=$(awk -F: '$1 == "LF" { sum += $2 } END { print sum + 0 }' coverage/lcov.info)
            if [ -n "$LINES" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              PCT=$((LINES * 100 / TOTAL))
              echo "Flutter line coverage: ${PCT}% (${LINES}/${TOTAL})"
              if [ "$PCT" -lt 40 ]; then
                echo "ERROR: Coverage ${PCT}% is below the 40% threshold"
                exit 1
              fi
            else
              echo "Warning: Could not parse coverage data"
            fi
          else
            echo "Warning: coverage/lcov.info not found"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: packages/flutter/coverage/lcov.info
          retention-days: 7
