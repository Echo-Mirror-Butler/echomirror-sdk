name: Python SDK CI

on:
  push:
    branches: [main]
    paths:
      - "crates/echomirror-python/**"
      - "crates/echomirror-core/**"
      - "crates/echomirror-stellar/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "crates/echomirror-python/**"
      - "crates/echomirror-core/**"
      - "crates/echomirror-stellar/**"
      - ".github/workflows/python-ci.yml"

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
        with:
          toolchain: stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv
        shell: bash
        run: python -m venv .venv

      - name: Build and install (develop mode)
        working-directory: crates/echomirror-python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ../../.venv/Scripts/activate
          else
            source ../../.venv/bin/activate
          fi
          pip install maturin pytest pytest-asyncio pytest-cov
          maturin develop --release

      - name: Run tests
        working-directory: crates/echomirror-python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source ../../.venv/Scripts/activate
          else
            source ../../.venv/bin/activate
          fi
          pytest -v --cov=echomirror --cov-report=term-missing --cov-report=html --cov-fail-under=50

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: crates/echomirror-python/htmlcov/
          retention-days: 7
