name: PR Guard

on:
  pull_request:
    branches: [main]

jobs:
  size-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            const labels = pr.labels.map(l => l.name);
            if (labels.includes('large-pr-approved')) {
              core.info(`PR size check skipped — "large-pr-approved" label is present (${total} lines).`);
              return;
            }

            if (total > 600) {
              core.warning(
                `This PR changes ${total} lines (+${additions}/-${deletions}). ` +
                "Consider splitting it into smaller PRs for easier review."
              );
            }
            if (total > 3000) {
              core.setFailed(
                `PR is too large (${total} lines changed). ` +
                "Please split into smaller focused PRs. " +
                'Add the "large-pr-approved" label to bypass this check.'
              );
            }

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    steps:
      - name: Require Changeset for JS Packages
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);

            if (labels.includes('skip-changeset') || pr.title.includes('Version Packages')) {
              core.info('Changeset check skipped (release PR or skip-changeset label present).');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const filenames = files.map(f => f.filename);
            const touchesJsPackages = filenames.some(f => f.startsWith('packages/js/'));
            const hasChangeset = filenames.some(
              f => f.startsWith('.changeset/') && f.endsWith('.md') && f !== '.changeset/README.md'
            );

            if (touchesJsPackages && !hasChangeset) {
              core.setFailed(
                'PR touches packages/js/* but does not include a changeset file (.changeset/*.md). ' +
                'Please generate a changeset by running "npm run changeset" locally and committing the generated file.'
              );
            }

