name: Size Limit

# Enforces the gzip transfer budgets declared in each package's `size-limit`
# configuration. The prior third-party action checked out and rebuilt the PR
# base branch from inside an npm workspace package, so unrelated base-branch
# failures made every size check red. Build the PR head once and inspect the
# generated artifacts directly instead.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/js/**'
      - 'scripts/check-size-limit.mjs'
      - '.github/workflows/size-limit.yml'

permissions:
  contents: read

jobs:
  size-limit-js:
    name: Size Limit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, mood, react, social, stellar]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/js/core
      - if: matrix.package != 'core'
        run: npm run build -w packages/js/${{ matrix.package }}
      - name: Enforce gzip size budget
        run: node scripts/check-size-limit.mjs packages/js/${{ matrix.package }}

  size-limit-wasm:
    name: Size Limit (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.lock') }}-wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:wasm -w packages/js/wasm
      - run: npm run build -w packages/js/wasm
      - name: Enforce gzip size budget
        run: node scripts/check-size-limit.mjs packages/js/wasm
