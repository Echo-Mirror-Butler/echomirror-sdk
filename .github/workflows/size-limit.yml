diff --git a/.github/workflows/size-limit.yml b/.github/workflows/size-limit.yml
new file mode 100644
index 0000000..5c9d78e
--- /dev/null
+++ b/.github/workflows/size-limit.yml
@@ -0,0 +1,106 @@
+name: Size Limit
+
+# Budgets the client-bundled JS packages (see each package's "size-limit"
+# field in package.json) and comments the size delta on every PR that
+# touches a budgeted package. Fails the job — not just the comment — when a
+# package goes over its budget.
+#
+# @echomirror/social and @echomirror/analytics are the two packages left
+# out of packages-js below: social is a false negative avoided on purpose —
+# it ships browser React hooks (useGlobalFeed/useLeaderboard) and a
+# WebSocketTransport for a live feed/leaderboard widget, so it gets a
+# budget like core/mood/react/stellar. analytics is left unbudgeted: it has
+# no React/DOM dependency, and its two exports (a webhook transport and
+# mood-aggregation helpers) are the kind of thing that runs in a backend
+# job aggregating stored data, not something dropped into a landing page.
+# If it ever grows a browser-facing entry point, it should get a budget
+# too — see CONTRIBUTING.md.
+#
+# Runs on push to main as well as on PRs: size-limit-action compares each
+# PR's size against a previously recorded baseline for the base branch
+# (fetched via the commit status API) rather than checking out and
+# rebuilding main itself, so without this workflow running on main too
+# there is no baseline yet for a PR to diff against.
+
+on:
+  push:
+    branches: [main]
+    paths:
+      - 'packages/js/**'
+      - '.github/workflows/size-limit.yml'
+  pull_request:
+    branches: [main]
+    paths:
+      - 'packages/js/**'
+      - '.github/workflows/size-limit.yml'
+
+permissions:
+  contents: read
+  pull-requests: write
+
+jobs:
+  size-limit-js:
+    name: Size Limit (${{ matrix.package }})
+    runs-on: ubuntu-latest
+    strategy:
+      fail-fast: false
+      matrix:
+        package: [core, mood, react, social, stellar]
+    steps:
+      - uses: actions/checkout@v7
+      - uses: actions/setup-node@v7
+        with:
+          node-version: 20
+          cache: npm
+      - run: npm ci
+      # mood, react, social, and stellar all depend on @echomirror/core;
+      # size-limit bundles that dependency's compiled dist/ output, so it
+      # has to exist before size-limit runs against a dependent package.
+      #
+      # We build every package ourselves (rather than letting
+      # size-limit-action's own build step run) because that action
+      # auto-detects npm workspaces and invokes
+      # `npm run build --workspace=@echomirror/<name>` from inside
+      # `directory:`, which fails with "No workspaces found" — that flag
+      # only resolves from the workspace root. skip_step: build sidesteps
+      # it entirely; we hand it an already-built dist/.
+      - run: npm run build -w packages/js/core
+      - if: matrix.package != 'core'
+        run: npm run build -w packages/js/${{ matrix.package }}
+      - name: Size Limit
+        uses: andresz1/size-limit-action@v1
+        with:
+          github_token: ${{ secrets.GITHUB_TOKEN }}
+          directory: packages/js/${{ matrix.package }}
+          skip_step: build
+          package_manager: npm
+
+  size-limit-wasm:
+    name: Size Limit (wasm)
+    runs-on: ubuntu-latest
+    steps:
+      - uses: actions/checkout@v7
+      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
+        with:
+          toolchain: stable
+          targets: wasm32-unknown-unknown
+      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
+        with:
+          key: ${{ hashFiles('Cargo.lock') }}-wasm
+      - uses: actions/setup-node@v7
+        with:
+          node-version: 20
+          cache: npm
+      - run: npm ci
+      - run: npm run build:wasm -w packages/js/wasm
+      # build:wasm only compiles the Rust/wasm-pack side; dist/index.js
+      # (what size-limit actually measures) comes from the separate tsc
+      # build step, same as every other JS package.
+      - run: npm run build -w packages/js/wasm
+      - name: Size Limit
+        uses: andresz1/size-limit-action@v1
+        with:
+          github_token: ${{ secrets.GITHUB_TOKEN }}
+          directory: packages/js/wasm
+          skip_step: build
+          package_manager: npm
