name: Cross-language contract tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Runners point at the shared fixture by default, but the workflow sets them
  # explicitly so a renamed port/host can never silently change what is tested.
  # Setting ECHOMIRROR_CONTRACT_SPEC also flips every runner from self-skip
  # into fail-if-unreachable mode — a mis-wired fixture is a red check, never
  # a green skip.
  ECHOMIRROR_CONTRACT_SPEC: ${{ github.workspace }}/contract-tests/contract-spec.json
  ECHOMIRROR_CONTRACT_API_BASE: http://127.0.0.1:18080
  ECHOMIRROR_CONTRACT_HORIZON_BASE: http://127.0.0.1:18081

jobs:
  rust:
    name: Rust contract
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.lock') }}-contract
      - name: Start fixture
        run: docker compose -f contract-tests/docker-compose.yml up -d --build
      - name: Wait for fixture (fail if it never comes up)
        run: |
          for i in $(seq 1 60); do
            api_ok=$(curl -sf http://127.0.0.1:18080/mood/streak > /dev/null && echo y || echo n)
            horiz_ok=$(curl -sf http://127.0.0.1:18081/accounts/GDKUJHNOCQ6NOFJCSPE5IZMFFRZ6U4VO3EEFJQKJSDK5B4VZTH4XKSKD > /dev/null && echo y || echo n)
            if [ "$api_ok" = y ] && [ "$horiz_ok" = y ]; then
              echo "fixture ready"
              exit 0
            fi
            echo "waiting for fixture ($i/60)…"
            sleep 2
          done
          docker compose -f contract-tests/docker-compose.yml logs
          echo "fixture did not become ready" >&2
          exit 1
      - run: cargo test -p echomirror-core --test contract
      - run: cargo test -p echomirror-stellar --test contract
      - name: Tear down fixture
        if: always()
        run: docker compose -f contract-tests/docker-compose.yml down --volumes

  js:
    name: JS contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start fixture
        run: docker compose -f contract-tests/docker-compose.yml up -d --build
      - name: Wait for fixture (fail if it never comes up)
        run: |
          for i in $(seq 1 60); do
            api_ok=$(curl -sf http://127.0.0.1:18080/mood/streak > /dev/null && echo y || echo n)
            horiz_ok=$(curl -sf http://127.0.0.1:18081/accounts/GDKUJHNOCQ6NOFJCSPE5IZMFFRZ6U4VO3EEFJQKJSDK5B4VZTH4XKSKD > /dev/null && echo y || echo n)
            if [ "$api_ok" = y ] && [ "$horiz_ok" = y ]; then
              echo "fixture ready"
              exit 0
            fi
            echo "waiting for fixture ($i/60)…"
            sleep 2
          done
          docker compose -f contract-tests/docker-compose.yml logs
          echo "fixture did not become ready" >&2
          exit 1
      - run: npx vitest run packages/js/core/tests/contract.test.ts
      - name: Tear down fixture
        if: always()
        run: docker compose -f contract-tests/docker-compose.yml down --volumes

  flutter:
    name: Flutter contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Start fixture
        working-directory: ${{ github.workspace }}
        run: docker compose -f contract-tests/docker-compose.yml up -d --build
      - name: Wait for fixture (fail if it never comes up)
        working-directory: ${{ github.workspace }}
        run: |
          for i in $(seq 1 60); do
            api_ok=$(curl -sf http://127.0.0.1:18080/mood/streak > /dev/null && echo y || echo n)
            horiz_ok=$(curl -sf http://127.0.0.1:18081/accounts/GDKUJHNOCQ6NOFJCSPE5IZMFFRZ6U4VO3EEFJQKJSDK5B4VZTH4XKSKD > /dev/null && echo y || echo n)
            if [ "$api_ok" = y ] && [ "$horiz_ok" = y ]; then
              echo "fixture ready"
              exit 0
            fi
            echo "waiting for fixture ($i/60)…"
            sleep 2
          done
          docker compose -f contract-tests/docker-compose.yml logs
          echo "fixture did not become ready" >&2
          exit 1
      - run: flutter test test/contract_test.dart
      - name: Tear down fixture
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose -f contract-tests/docker-compose.yml down --volumes

  python:
    name: Python contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.lock') }}-contract-python-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv and install tooling
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest pytest-asyncio

      - name: Build and install echomirror-python (develop mode)
        working-directory: crates/echomirror-python
        run: |
          source ../../.venv/bin/activate
          maturin develop --release

      - name: Start fixture
        run: docker compose -f contract-tests/docker-compose.yml up -d --build

      - name: Wait for fixture (fail if it never comes up)
        run: |
          for i in $(seq 1 60); do
            api_ok=$(curl -sf http://127.0.0.1:18080/mood/streak > /dev/null && echo y || echo n)
            horiz_ok=$(curl -sf http://127.0.0.1:18081/accounts/GDKUJHNOCQ6NOFJCSPE5IZMFFRZ6U4VO3EEFJQKJSDK5B4VZTH4XKSKD > /dev/null && echo y || echo n)
            if [ "$api_ok" = y ] && [ "$horiz_ok" = y ]; then
              echo "fixture ready"
              exit 0
            fi
            echo "waiting for fixture ($i/60)…"
            sleep 2
          done
          docker compose -f contract-tests/docker-compose.yml logs
          echo "fixture did not become ready" >&2
          exit 1

      - name: Run Python contract tests
        run: |
          source .venv/bin/activate
          pytest contract-tests/runners/python/ -v

      - name: Tear down fixture
        if: always()
        run: docker compose -f contract-tests/docker-compose.yml down --volumes

  swift:
    name: Swift contract
    runs-on: macos-14
    env:
      ECHOMIRROR_CONTRACT_SPEC: ${{ github.workspace }}/contract-tests/contract-spec.json
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable (2026-08-05)
        with:
          toolchain: stable
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build EchoMirrorFFI XCFramework
        run: bash packages/swift/EchoMirrorSDK/Scripts/build-xcframework.sh
      # Swift contract tests are FFI-local (no HTTP), so they do not need the
      # docker fixture and therefore do not start one on this macOS runner.
      - name: Run Swift tests (incl. contract)
        run: swift test --package-path packages/swift/EchoMirrorSDK