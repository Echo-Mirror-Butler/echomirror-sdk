name: Sync Live Testnet

# Runs the echomirror-sync integration tests against the real public Stellar
# Horizon testnet (SSE streaming + Friendbot funding + backfill). Kept off the
# PR path deliberately: public testnet infrastructure can be slow or flaky.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # nightly, 04:00 UTC

env:
  CARGO_TERM_COLOR: always

# Default-deny GITHUB_TOKEN scope (#222): jobs opt in to anything beyond read.
permissions:
  contents: read

jobs:
  live-testnet:
    name: Live Horizon testnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable (2026-08-05)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p echomirror-sync --test testnet_live_tests -- --ignored --test-threads=1
        env:
          ECHOMIRROR_LIVE_TESTS: "1"
