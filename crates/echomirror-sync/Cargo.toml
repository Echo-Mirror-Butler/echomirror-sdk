[package]
name = "echomirror-sync"
description = "EchoMirror blockchain sync engine — real-time Stellar SSE streaming with resumable cursors and gap backfill"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["echomirror", "stellar", "sync", "sse", "streaming"]
categories = ["api-bindings", "asynchronous", "database", "network-programming"]
# Issue #195: the `postgres` and `redis` cursor stores are behind optional
# features but are part of this crate's documented API, so docs.rs must build
# with all of them or those modules would be missing from the rendered docs.
[package.metadata.docs.rs]
all-features = true
# benches/support.rs is shared helper code (via #[path]), not a bench target.
autobenches = false

[features]
default = []
postgres = ["dep:sqlx"]
redis = ["dep:redis"]
# Exposes SyncEngine::crash_for_test, which aborts sync tasks without
# releasing their leadership lease, to simulate an unclean process crash in
# leader-election tests.
test-util = []

[dependencies]
# Issue #195: version + path on every internal dependency — see the note in
# echomirror-stellar/Cargo.toml.
echomirror-core = { version = "0.1.0", path = "../echomirror-core" }
echomirror-stellar = { version = "0.1.0", path = "../echomirror-stellar" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["stream"] }
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
rand.workspace = true
futures = "0.3"
tokio-stream = { version = "0.1", features = ["time"] }
eventsource-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
wiremock.workspace = true
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "cursor_store_bench"
harness = false
