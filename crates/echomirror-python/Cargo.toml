[package]
name = "echomirror-python"
description = "PyO3 native bindings for the EchoMirror SDK — Mood, Stellar, and Social APIs, with asyncio support"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Must match the `module-name` leaf in pyproject.toml ([tool.maturin]).
name = "_echomirror"
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
echomirror-core = { path = "../echomirror-core" }
echomirror-stellar = { path = "../echomirror-stellar" }
# Issue #196: abi3-py39 targets Python's stable/limited C API from 3.9
# onward, so maturin builds one wheel per platform (cp39-abi3-...) instead
# of one per CPython minor version — it works unmodified on every newer
# interpreter, including 3.13/3.14, without a rebuild.
pyo3 = { workspace = true, features = ["extension-module", "generate-import-lib", "abi3-py39"] }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
tokio.workspace = true
serde_json.workspace = true
chrono.workspace = true

[package.metadata.maturin]
python-source = "python"
module-name = "echomirror._echomirror"
