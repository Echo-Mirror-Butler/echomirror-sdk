<?xml version="1.0" encoding="UTF-8"?>
<!-- EchoMirror extension icon. Source for icons/icon{16,32,48,128}.png;
     regenerate with `npm run icons -w extensions/chrome` after editing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- handle -->
  <rect x="56" y="82" width="16" height="32" rx="8" fill="#ffffff"/>
  <!-- mirror frame + glass -->
  <ellipse cx="64" cy="54" rx="36" ry="40" fill="#ffffff"/>
  <ellipse cx="64" cy="54" rx="27" ry="31" fill="#4f46e5"/>
  <ellipse cx="64" cy="54" rx="27" ry="31" fill="url(#glass)" opacity="0.18"/>
  <!-- reflection glint -->
  <path d="M50 42 Q55 32 66 30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>
